[project]
name = "risklab-mdl-v2"
version = "2.0.0"
description = "风控建模计算层 MCP Server（跨平台）：skill 编排 + MCP 计算 + agent 交互"
readme = "README.md"
requires-python = ">=3.11"
# 非商业许可：允许个人/研究/教育等非商业用途，禁止商业使用。完整条款见 LICENSE。
license = { text = "PolyForm Noncommercial License 1.0.0" }
# 依赖清单只放真实 import 的包，不按「可能用得上」添加。
dependencies = [
    "mcp>=2.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "hyperopt>=0.2.7",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "filelock>=3.12",       # 跨平台文件锁（替代旧项目的 POSIX-only fcntl）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",          # 本项目用 unittest；pytest 仅为单文件调试便利
]

[project.scripts]
risklab-mdl = "risklab_mdl.server:main"
risklab-mdl-doctor = "risklab_mdl.doctor:main"

[project.urls]
Homepage = "https://github.com/yuyong513/risklab-mdl-v2"
Repository = "https://github.com/yuyong513/risklab-mdl-v2"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
